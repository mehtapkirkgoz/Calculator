<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calc-container">
      <div class="head-container">
        <div class="display">
          <div class="display-controls"></div>
          <div class="display-current">0</div>
        </div>
      </div>
      <div class="keypad">
        <button class="btn percent special-btn" title="Percent">%</button>
        <button class="btn clear-all special-btn" title="Clear-All">CE</button>
        <button class="btn clear special-btn" title="Clear">C</button>
        <button class="btn backspace" title="BackSpace">←</button>
        <button class="btn inverse special-btn" title="İnverse">x⁻¹</button>
        <button class="btn power special-btn" title="Power">x²</button>
        <button class="btn sqrt special-btn" title="Square">²√x</button>
        <button class="btn divide oprt" title="Divide">/</button>
        <button class="btn num seven">7</button>
        <button class="btn num eight">8</button>
        <button class="btn num nine">9</button>
        <button class="btn multiply oprt" title="Multiply">*</button>
        <button class="btn num four">4</button>
        <button class="btn num five">5</button>
        <button class="btn num six">6</button>
        <button class="btn subtract oprt" title="Subtract">-</button>
        <button class="btn num one">1</button>
        <button class="btn num two">2</button>
        <button class="btn num three">3</button>
        <button class="btn addition oprt" title="Addition">+</button>
        <button class="btn num zero">0</button>
        <button class="btn decimal" title="Decimal">.</button>
        <button class="btn equals" title="Equals">=</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
