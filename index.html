<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calc-container">
      <div class="head-container">
        <div class="header-left"></div>
        <div class="header-right">
          <div class="display-controls"></div>
          <div class="display-current"></div>
        </div>
      </div>
      <div class="keypad">
        <button class="btn percent"></button>
        <button class="btn clear-all"></button>
        <button class="btn clear"></button>
        <button class="btn backspace"></button>
        <button class="btn inverse"></button>
        <button class="btn power"></button>
        <button class="btn sqrt"></button>
        <button class="btn divide"></button>
        <button class="btn num-seven"></button>
        <button class="btn num-eight"></button>
        <button class="btn num-nine"></button>
        <button class="btn multiply"></button>
        <button class="btn num-four"></button>
        <button class="btn num-five"></button>
        <button class="btn num-six"></button>
        <button class="btn subtract"></button>
        <button class="btn num-one"></button>
        <button class="btn num-two"></button>
        <button class="btn num-three"></button>
        <button class="btn addition"></button>
        <button class="btn num-zero"></button>
        <button class="btn decimal"></button>
        <button class="btn equals"></button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
