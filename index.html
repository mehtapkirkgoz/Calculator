<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calc-container">
      <div class="head-container">
        <div class="display">
          <div class="display-controls"></div>
          <div class="display-current">0</div>
        </div>
      </div>
      <div class="keypad">
        <button class="btn percent special-btn">%</button>
        <button class="btn clear-all special-btn">CE</button>
        <button class="btn clear special-btn">C</button>
        <button class="btn backspace">←</button>
        <button class="btn inverse special-btn">x⁻¹</button>
        <button class="btn power special-btn">x²</button>
        <button class="btn sqrt special-btn">²√x</button>
        <button class="btn divide oprt">/</button>
        <button class="btn num-seven">7</button>
        <button class="btn num-eight">8</button>
        <button class="btn num-nine">9</button>
        <button class="btn multiply oprt">*</button>
        <button class="btn num-four">4</button>
        <button class="btn num-five">5</button>
        <button class="btn num-six">6</button>
        <button class="btn subtract oprt">-</button>
        <button class="btn num-one">1</button>
        <button class="btn num-two">2</button>
        <button class="btn num-three">3</button>
        <button class="btn addition oprt">+</button>
        <button class="btn num-zero">0</button>
        <button class="btn decimal">.</button>
        <button class="btn equals">=</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
